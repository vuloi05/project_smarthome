; PlatformIO Project Configuration File
; Bo mạch: DOIT ESP32 DEVKIT V1 / NodeMCU-32S (ESP-WROOM-32, CP2102 USB-UART)
; VID: 10C4 (Silicon Labs) - PID: EA60 (CP2102)

[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino

; Tốc độ nạp và theo dõi Serial Monitor qua chip CP2102
monitor_speed = 115200
upload_speed = 921600
monitor_filters = time, default
