name: Smart Home CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up GCC and Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make python3

      - name: Compile C Applications
        run: |
          make all

      - name: Verify Executables Exist
        run: |
          test -x bin/device_server
          test -x bin/user_client
          test -x bin/web_dashboard

      - name: Run Automated Protocol Test Suite
        run: |
          python3 scripts/test_protocol.py --spawn-device
